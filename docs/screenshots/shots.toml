path = "/admin/incidents/impact/"

[[shots]]
name = "ui_standard_add_edit"
role = "regulator_admin"
path = "/admin/incidents/impact/add/"

[[shots]]
name = "ui_admin_export"
role = "regulator_admin"
path = "/admin/governanceplatform/exportjob/add/"

[[shots]]
name = "ui_admin_import"
role = "regulator_admin"
path = "/admin/governanceplatform/importjob/add/"

# --- Platform administrator -------------------------------------------------

[[shots]]
name = "ui_platform_admin"
role = "platform_admin"
path = "/admin/"
full_page = true

[[shots]]
name = "ui_platform_admin_observer"
role = "platform_admin"
path = "/admin/governanceplatform/entitycategory/"

[[shots]]
name = "ui_observer_regulation"
role = "platform_admin"
path = "/admin/governanceplatform/observer/"

# --- Not covered yet --------------------------------------------------------
#
# The published User Manual, administration and reporting chapters own the bulk
# of the screenshots and none of them are scripted here yet:
#
#   user_manual_images/UM_SER_*        the split User Manual pages
#   platform_admin_images/PLAT_ADM_*   ui_platform_admin/
#   regulator_admin_images/Reg_Admin_* ui_regulator_admin/
#   reporting_module_images/Rep_*      ui_reporting_module/
#
# ui_admin_export / ui_admin_import above belong to ui_import-export.rst, which
# is not in any toctree — capture them only if that page comes back.
