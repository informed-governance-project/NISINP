<div{% if widget.attrs.id %} id="{{ widget.attrs.id }}"{% endif %}{% if widget.attrs.class %} class="{{ widget.attrs.class }}"{% endif %}>{% for group, options, index in widget.optgroups %}{% if group %}
  <div><label>{{ group }}</label></div>{% endif %}{% for option in options %}
  <div class="form-check">
    <input class="form-check-input" type="{{ option.type }}" name="{{ option.name }}"{% if option.value != None %} value="{{ option.value|stringformat:'s' }}"{% endif %}{% for attr_name, attr_value in option.attrs.items %}{% if attr_name != "class" and attr_value is not False %} {{ attr_name }}{% if attr_value is not True %}="{{ attr_value|stringformat:'s' }}"{% endif %}{% endif %}{% endfor %}>
    <label class="form-check-label" for="{{ option.attrs.id }}">{{ option.label }}</label>
  </div>{% endfor %}{% endfor %}
</div>
