[project]
name = "governanceplatform"
version = "0.5.17"
description = "Governance Platform - SERIMA"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["NC3-LU", "NIS", "NIS2", "incident-notification"]
requires-python = ">=3.14,<4"
authors = [
    { name = "Cédric Bonhomme", email = "cedric.bonhomme@nc3.lu" },
    { name = "Jérôme Lombardi", email = "jerome.lombardi@nc3.lu" },
    { name = "Juan Rocha", email = "juan.rocha@nc3.lu" },
    { name = "Ruslan Baidan", email = "ruslan.baidan@nc3.lu" },
]
dependencies = [
    "django>=6.0,<7",
    "psycopg2-binary>=2.8.4,<3",
    "cryptography>=50.0.0,<51",
    "django-cors-headers>=4.3.1,<5",
    "drf-spectacular>=0.30.0,<0.31",
    "drf-spectacular-sidecar>=2026.4.1,<2027",
    "django-bootstrap5>=26.2,<27",
    "django-otp>=1.1.6,<2",
    "django-formtools>=2.5.1,<3",
    "django-two-factor-auth>=1.15.5,<2",
    "phonenumbers>=9.0.27,<10",
    "django-import-export>=4.4.0,<5",
    "django-parler>=2.4,<3",
    "django-countries>=9.0.0,<10",
    "weasyprint>=70.0,<71",
    "django-extensions>=4.1,<5",
    "django-parler-rest>=2.2,<3",
    "python-dateutil>=2.8.2,<3",
    "django-phonenumber-field>=8.4.0,<9",
    "django-filter>=26.1,<27",
    "pytz>=2026.1,<2027",
    "plotly>=7.0.0,<8",
    "kaleido>=1.2.0,<2",
    "openpyxl>=3.1.5,<4",
    "django-cookiebanner>=0.2.8,<0.3",
    "django-health-check>=4.0.0,<5",
    "whitenoise>=6.9.0,<7",
    "django-simple-captcha>=0.7.0,<0.8",
    "celery>=5.5.1,<6",
    "redis>=8.0.0,<9",
    "markdown>=3.10.1,<4",
    "bleach>=6.3.0,<7",
    "gunicorn>=26.0.0,<27",
    "requests>=2.34.2,<3",
]

[project.urls]
Homepage = "https://github.com/informed-governance-project/SERIMA"
Repository = "https://github.com/informed-governance-project/SERIMA"
Documentation = "https://serima.readthedocs.io"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.group.dev.dependencies]
ruff = "^0.16.1"
pre-commit = "^4.2.0"
autoflake = "^2.3.1"
mypy = "<2.4"
django-stubs = {version = "^6.0.3", extras = ["compatible-mypy"]}
types-requests = "^2.32.0.20250515"
pip-audit = "^2.9.0"
pyparsing = "^3.2.3"
pytest = "^9.0.3"
pytest-django = "^4.11.1"
pytest-html = "^4.1.1"
pytest-cov = "^7.1.0"


[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx-book-theme = "^1.0.1"
sphinxcontrib-openapi = "^0.8.1"
pydot = "^1.4.2"
sphinx = "^9.1.0"
playwright = "^1.62.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_errors = false
ignore_missing_imports = true
strict_optional = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unreachable = true
show_error_context = true
pretty = true
plugins = ["mypy_django_plugin.main"]
exclude = [
    "migrations/",
    "theme/",
    "docker/",
    "docs/",
    "node_modules/",
]

[tool.django-stubs]
strict_settings = false
django_settings_module = "governanceplatform.settings"

[tool.ruff]
exclude = ["migrations"]
target-version = "py314"
line-length = 140

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "Q",
    "W",
    "PD",
    "TC",
    "UP",
    "C90",
    "FLY",
    "INT",
    "ISC",
    "ICN",
    "LOG",
    "NPY",
    "PIE",
    "PLE",
    "PLW",
    "PYI",
    "RET",
    "T20",
    "TID",
    "SLOT",
]

[tool.ruff.lint.per-file-ignores]
# A command-line tool reports progress on stdout.
"docs/screenshots/capture.py" = ["T20"]

[tool.ruff.lint.mccabe]
max-complexity = 36
